<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zapshot Vlog fonts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap">
<style>
:root{
  --bg:#fff; --ink:#000; --muted:#737373; --line:#dbdbdb; --field:#efefef; --heart:#ff3040; --toast:#262626; --toast-ink:#fff;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000;--ink:#f5f5f5;--muted:#a8a8a8;--line:#262626;--field:#262626;--toast:#f5f5f5;--toast-ink:#000;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--ink:#f5f5f5;--muted:#a8a8a8;--line:#262626;--field:#262626;--toast:#f5f5f5;--toast-ink:#000;color-scheme:dark}
:root[data-theme="light"]{--bg:#fff;--ink:#000;--muted:#737373;--line:#dbdbdb;--field:#efefef;--toast:#262626;--toast-ink:#fff;color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:is(button,input,a):focus-visible{outline:2px solid #0095f6;outline-offset:2px}
.col{max-width:1280px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .col{display:flex;align-items:center;gap:10px;height:60px;padding:0 16px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;white-space:nowrap}
.back{display:none;font-size:26px;line-height:1;padding:4px 8px 4px 0}
.fav-view .back{display:block}
.look{display:inline-flex;padding:3px;border-radius:10px;background:var(--field);gap:2px}
.look button{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px;color:var(--muted);white-space:nowrap}
.look button[aria-checked="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.look i{width:14px;height:14px;border-radius:2px;background:#000;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5);display:inline-block}
.look .w i{background:#F2EFE9;border-radius:5px}
.favbtn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:7px 10px;border-radius:8px;white-space:nowrap}
.favbtn svg{width:24px;height:24px}
.favbtn .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--heart);color:#fff;font-size:12px;line-height:20px;text-align:center}
.favbtn .n[hidden]{display:none}
.favbtn.bump svg{animation:bump .4s ease}
.favbtn.bump .n{animation:bump .4s ease}
@keyframes bump{35%{transform:scale(1.3)}}
.fav-view .top .look,.fav-view .favbtn{display:none}
.share{display:none;font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;background:#0095f6;color:#fff}
.fav-view .share{display:block}

/* stories */
.stories{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none}
.ring{width:66px;height:66px;border-radius:50%;padding:2px;background:var(--line)}
.story[aria-pressed="true"] .ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ring span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--field);border:3px solid var(--bg);font-size:22px;line-height:1}
.story small{font-size:12px;color:var(--ink);max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{padding:0 16px 8px;max-width:420px}
.search input{width:100%;font:inherit;font-size:16px;background:var(--field);color:var(--ink);border:0;border-radius:8px;padding:9px 14px}
.fav-view .stories,.fav-view .search{display:none}

/* posts */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 18px;padding:0 16px 96px;align-items:start}
.fav-view .feed{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.feed > .group-h,.feed > .more,.feed > .empty{grid-column:1/-1}
.group-h{padding:18px 0 0;font-size:16px;font-weight:700}
.group-h.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sort{display:inline-flex;padding:3px;border-radius:10px;background:var(--field);gap:2px}
.sort button{font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;color:var(--muted)}
.sort button[aria-checked="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.group-h small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.post{content-visibility:auto;contain-intrinsic-size:280px 580px}
.post .media{cursor:pointer}
.media .vlog{border-radius:4px}
.fav .vlog{border-radius:4px}
.vlog.paper{box-shadow:inset 0 0 0 1px var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:0 0 10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;flex:none;border:1px solid var(--line);overflow:hidden}
.av span{display:inline-block;white-space:nowrap;transform-origin:center}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who a{color:inherit;text-decoration:none}
.who a:hover{text-decoration:underline}
.who a::after{content:" ↗";font-weight:400;color:var(--muted);font-size:12px}
.vhead .who a::after{color:rgba(255,255,255,.7)}
.who small{display:block;font-size:12px;color:var(--muted);line-height:16px}
.media{position:relative;user-select:none;-webkit-user-select:none}
.pop{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;color:var(--heart);filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));pointer-events:none;z-index:5}
.acts{display:flex;align-items:center;gap:6px;padding:4px 0 0}
.acts .hb{width:32px;padding:8px 8px 8px 0}
.hb{width:40px;height:40px;padding:8px;color:var(--ink)}
.hb svg{width:24px;height:24px;display:block}
.hb .on{display:none;color:var(--heart)}
.hb[aria-pressed="true"] .on{display:block}.hb[aria-pressed="true"] .off{display:none}
.hb:active svg{transform:scale(.85)}
.hb.pulse .on{animation:bump .4s ease}
.acts .gf{margin-left:auto;font-size:13px;color:var(--muted);padding:8px;text-decoration:none}
.cap-line{padding:2px 16px 0;font-size:14px}
.cap-line b{font-weight:600;margin-right:4px}
.cap-line span{color:var(--muted)}
.more{display:block;margin:20px auto 0;padding:10px 18px;border-radius:8px;background:var(--field);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:48px 24px}

/* favorites */
.fav{min-width:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rm{font-size:14px;font-weight:600;color:var(--heart);padding:8px 10px}

/* full-screen viewer */
.viewer{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
.viewer[hidden]{display:none}
.vcol{--vh:min(calc(100dvh - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),calc((100vw - 16px) * 720 / 405));width:calc(var(--vh) * 405 / 720);display:flex;flex-direction:column}
.vbox{position:relative;height:var(--vh);width:100%}
.vbox .vlog{width:100%;height:100%;border-radius:10px}
.vhead{display:flex;align-items:center;gap:10px;padding:0 0 10px}
.vhead .av{background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
.vhead .who small{color:rgba(255,255,255,.75)}
.vhead .x{font-size:28px;line-height:1;padding:2px 6px;color:#fff}
.vfoot{display:flex;align-items:center;padding:4px 0 0;margin-left:-8px}
.vfoot .hb{color:#fff}
.vlook{margin-left:8px;background:rgba(255,255,255,.12)}
.vlook button{color:rgba(255,255,255,.7)}
.vlook button[aria-checked="true"]{background:#fff;color:#000}
.vfoot small{margin-left:auto;margin-right:8px;color:rgba(255,255,255,.75);font-size:12px}
.nav{position:absolute;top:50%;z-index:4;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(255,255,255,.9);color:#000;font-size:24px;line-height:44px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.nav.prev{left:-60px}.nav.next{right:-60px}
.nav[disabled]{opacity:.25;cursor:default}
@media (max-width:640px){.nav{display:none}}
body.noscroll{overflow:hidden}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--toast);color:var(--toast-ink);border-radius:10px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{font-weight:700;color:#0095f6;padding:4px 8px}
.fly{position:fixed;left:0;top:0;z-index:50;width:28px;height:28px;color:var(--heart);pointer-events:none}

/* ---------- Vlog (405×720 canvas units) ---------- */
.vlog{--u:calc(100cqw / 405);--r:0;--stroke:0;--pad:8;container-type:inline-size;position:relative;display:block;width:100%;aspect-ratio:405/720;background:#000;overflow:hidden;color:#fff;--ink-dark:#2A2622}
.vlog.paper{background:#F2EFE9;--r:28.08;--stroke:4.25;--pad:14.04}
.wm{position:absolute;left:0;right:0;top:0;height:calc(48 * var(--u));display:flex;align-items:center;justify-content:center;font-family:"Carter One",system-ui,sans-serif;font-size:calc(14 * var(--u));letter-spacing:.03em;color:rgba(255,255,255,.4)}
.paper .wm{color:rgba(42,38,34,.5)}
.clip{position:absolute;left:calc(10.5 * var(--u));width:calc(384 * var(--u));height:calc(216 * var(--u));border-radius:calc(var(--r) * var(--u));overflow:hidden;isolation:isolate;background:#000}
.paper .clip{background:#F2EFE9}
.clip.r0{top:calc(48 * var(--u))}.clip.r1{top:calc(266 * var(--u))}.clip.r2{top:calc(484 * var(--u))}
.mw{position:absolute;inset:calc(var(--stroke) * var(--u));border-radius:calc((var(--r) - var(--stroke)) * var(--u));overflow:hidden;background:#222}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}

const W_TIME = 500, W_TEXT = 400;
const nearest = (ws, t) => ws.reduce((a,b) => Math.abs(b-t) < Math.abs(a-t) || (Math.abs(b-t) === Math.abs(a-t) && b > a) ? b : a);

const $ = id => document.getElementById(id);

/* ---------- font loading ---------- */
const loaded = new Set();
function loadFont(font){
  if (!font || loaded.has(font.id)) return;
  loaded.add(font.id);
  const l = document.createElement("link"); l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=" + font.f.replace(/ /g,"+") + (font.w.length > 1 || font.w[0] !== 400 ? ":wght@" + font.w.join(";") : "") + "&display=swap";
  document.head.appendChild(l);
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target, font = BY_ID[el.dataset.id];
  loadFont(font);
  document.fonts.load(`${nearest(font.w, W_TIME)} 20px "${font.f}"`).finally(() => { el.classList.remove("loading"); fitAv(el); });
  io.unobserve(el);
}), { rootMargin: "1200px 0px" });

/* ---------- Vlog ---------- */
function vlogHTML(k, look){
  const rows = [0,1,2].map(j => CLIPS[(k + j) % 4]);
  return `<div class="vlog ${look}"><div class="wm">Zapshot</div>` + rows.map((r, i) => {
    const blur = i === 2, cap = i === 0 ? `<div class="cap">${r.c}</div>` : "";
    return `<div class="clip r${i}${blur ? " blur" : ""}"><div class="mw"><div class="bg i${r.img}"></div></div><div class="tx"><div class="time">8am</div>${cap}${blur ? AG : ""}</div><div class="nm">${r.n}</div></div>`;
  }).join("") + `</div>`;
}
function fitAv(root){
  root.querySelectorAll(".av span").forEach(s => { s.style.transform = ""; const w = s.offsetWidth; if (w > 22) s.style.transform = `scale(${22 / w})`; });
}
function styleIn(el, font){
  const ff = fam(font.f), wt = nearest(font.w, W_TIME), wx = nearest(font.w, W_TEXT);
  el.querySelectorAll(".time,.av span").forEach(n => { n.style.fontFamily = ff; n.style.fontWeight = wt; });
  el.querySelectorAll(".cap,.nm").forEach(n => { n.style.fontFamily = ff; n.style.fontWeight = wx; });
}
const subtitle = font => [CURRENT[font.f], CATN[font.c]].filter(Boolean).join(" · ");

/* ---------- state ---------- */
let look = "daily";
const view = { cat:"all", q:"", sort:"pop" };

function heartButton(font){
  const b = document.createElement("button");
  b.className = "hb"; b.dataset.id = font.id;
  b.setAttribute("aria-label", "Favorite " + font.f);
  b.setAttribute("aria-pressed", likes.has(font.id));
  b.innerHTML = HEART_OFF + HEART_ON;
  b.addEventListener("click", () => toggle(font, b));
  return b;
}
function post(font){
  const el = document.createElement("article");
  el.className = "post loading"; el.dataset.id = font.id;
  const k = idx++ % 4;
  el.innerHTML = `<div class="ph"><div class="av"><span>Aa</span></div><div class="who"><b></b><small>${subtitle(font)}</small></div></div>
    <div class="media">${vlogHTML(k, look)}</div>
    <div class="acts"></div>`;
  setName(el.querySelector(".who b"), font);
  el.querySelector(".acts").appendChild(heartButton(font));
  styleIn(el, font);
  tapHandler(el.querySelector(".media"), font, () => openViewer(font.id));
  io.observe(el);
  return el;
}

const gfUrl = f => "https://fonts.google.com/specimen/" + f.replace(/ /g,"+");
function setName(b, font){
  b.innerHTML = ""; const a = document.createElement("a");
  a.href = gfUrl(font.f); a.target = "_blank"; a.rel = "noopener"; a.textContent = font.f;
  a.title = "Open " + font.f + " on Google Fonts"; b.appendChild(a);
}
function tapHandler(media, font, single){
  let timer = null;
  media.addEventListener("click", () => {
    if (timer){ clearTimeout(timer); timer = null; popHeart(media); if (!likes.has(font.id)) like(font, media); return; }
    timer = setTimeout(() => { timer = null; single && single(); }, 280);
  });
}

/* ---------- full-screen viewer ---------- */
let vIds = [], vi = 0, vFont = null;
const viewer = $("viewer");
function openViewer(id, ids){
  vIds = ids || [...feed.querySelectorAll(".post")].map(p => p.dataset.id);
  vi = Math.max(0, vIds.indexOf(id));
  viewer.hidden = false; document.body.classList.add("noscroll");
  showV();
  $("vClose").focus();
}
function showV(){
  const font = BY_ID[vIds[vi]]; if (!font) return;
  vFont = font; loadFont(font);
  setName($("vName"), font); $("vSub").textContent = subtitle(font);
  const stage = $("vStage");
  stage.innerHTML = vlogHTML(vi % 4, look);
  const box = $("vcol"); styleIn(box, font);
  document.fonts.load(`${nearest(font.w, W_TIME)} 20px "${font.f}"`).finally(() => fitAv(box));
  const foot = $("vFoot"); foot.querySelector(".hb")?.remove();
  foot.prepend(heartButton(font));
  $("vPos").textContent = `${vi + 1} / ${inFav ? vIds.length : (list.length || vIds.length)}`;
  $("vPrev").disabled = vi === 0;
  $("vNext").disabled = vi >= vIds.length - 1 && (inFav || shown >= list.length);
}
function stepV(d){
  if (!inFav && d > 0 && vi >= vIds.length - 1 && shown < list.length){ more(); vIds = [...feed.querySelectorAll(".post")].map(p => p.dataset.id); }
  const n = vi + d; if (n < 0 || n >= vIds.length) return;
  vi = n; showV();
}
function closeViewer(){ viewer.hidden = true; document.body.classList.remove("noscroll"); const p = feed.querySelector(`[data-id="${vFont?.id}"]`); p && p.scrollIntoView({block:"center"}); }
$("vClose").addEventListener("click", closeViewer);

viewer.addEventListener("click", e => { if (e.target === viewer) closeViewer(); });
document.addEventListener("keydown", e => {
  if (viewer.hidden) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); stepV(1); }

    const q = view.q.toLowerCase();
    list = sortList(FONTS.filter(x => x.f.toLowerCase().includes(q)));
    if (!list.length){ feed.innerHTML = '<p class="empty">No fonts match.</p>'; return; }
    feed.appendChild(listHeader("Results", list.length));
    more(); return;
  }
  list = sortList(FONTS.filter(x => view.cat === "all" || x.c === view.cat));
  feed.appendChild(listHeader(view.cat === "all" ? "All fonts" : CATN[view.cat], list.length));
  more();
}
function sortList(l){ return view.sort === "pop" ? l.sort((a,b) => a.p - b.p) : l.sort((a,b) => a.f.localeCompare(b.f)); }
function listHeader(title, n){
  const h = document.createElement("div"); h.className = "group-h row";
  h.innerHTML = `<div>${title}<small>${n.toLocaleString()} fonts</small></div><div class="sort" role="radiogroup" aria-label="Sort"><button role="radio" data-s="pop" aria-checked="${view.sort === "pop"}">Popular</button><button role="radio" data-s="az" aria-checked="${view.sort === "az"}">A to Z</button></div>`;
  h.querySelector(".sort").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.dataset.s === view.sort) return; view.sort = b.dataset.s; render(); });
  return h;
}
function more(){
  feed.querySelector(".more")?.remove();
  const frag = document.createDocumentFragment();
  list.slice(shown, shown + PAGE).forEach(f => frag.appendChild(post(f)));
  shown = Math.min(shown + PAGE, list.length);
  feed.appendChild(frag);
  if (shown < list.length){
    const b = document.createElement("button"); b.className = "more"; b.textContent = "Show more";
    b.addEventListener("click", more); feed.appendChild(b);
    moreObs.observe(b);
  }
}
const moreObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ moreObs.unobserve(e.target); more(); } }), { rootMargin: "1600px 0px" });

/* ---------- favorites view ---------- */
let inFav = false;
function openFav(){
  inFav = true; document.body.classList.add("fav-view");
  $("title").textContent = "Favorites"; window.scrollTo(0,0); renderFav();
}
function closeFav(){
  inFav = false; document.body.classList.remove("fav-view");
  $("title").textContent = "Vlog fonts"; render(); window.scrollTo(0,0);
}
function renderFav(){
  feed.innerHTML = ""; idx = 0;
  const items = [...likes.entries()].sort((a,b) => (a[1].at||0) - (b[1].at||0));
  if (!items.length){ feed.innerHTML = '<p class="empty">Tap ♡ on a font, or double-tap its Vlog, to keep it here.</p>'; return; }
  items.forEach(([id]) => {
    const font = BY_ID[id]; if (!font) return;
    const el = document.createElement("article");
    el.className = "fav loading"; el.dataset.id = id;
    const k = idx++ % 4;
    el.innerHTML = `<div class="ph"><div class="av"><span>Aa</span></div><div class="who"><b></b><small>${subtitle(font)}</small></div><button class="rm">Remove</button></div><div class="duo">${vlogHTML(k,"daily")}${vlogHTML(k,"paper")}</div>`;
    setName(el.querySelector(".who b"), font);
    el.querySelector(".rm").addEventListener("click", () => unlike(font));
    el.querySelectorAll(".duo .vlog").forEach((v, j) => { v.style.cursor = "pointer"; v.addEventListener("click", () => { setLook(j ? "paper" : "daily"); openViewer(id, [...feed.querySelectorAll(".fav")].map(x => x.dataset.id)); }); });
    styleIn(el, font);
    feed.appendChild(el);
    io.observe(el);
  });
}
favBtn.addEventListener("click", openFav);
$("share").addEventListener("click", async () => {
  const items = [...likes.values()].sort((a,b) => (a.at||0) - (b.at||0));
  const txt = "Vlog font favorites\n" + items.map(v => `${v.family}  ${gfUrl(v.family)}`).join("\n");
  try { await navigator.clipboard.writeText(txt); toast("Copied. Paste it anywhere to share."); }
  catch(e){ window.prompt("Copy this list", txt); }
});
function toast(msg, undoable){
  $("toastMsg").textContent = msg; $("undo").hidden = !undoable;
  $("toast").classList.add("show");
  clearTimeout(undoT); undoT = setTimeout(() => { $("toast").classList.remove("show"); lastRemoved = null; }, undoable ? 5000 : 2500);
}
$("back").addEventListener("click", closeFav);

/* ---------- likes (shared when available) ---------- */
const likes = new Map();
let col = null, me = null;
const LS = "zapshot-font-likes";
try { Object.entries(JSON.parse(localStorage.getItem(LS) || "{}")).forEach(([k,v]) => likes.set(k,v)); } catch(e){}
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(Object.fromEntries(likes))); } catch(e){} };
async function write(id, data){
  if (col){ try { data ? await col.doc(id).set(data) : await col.doc(id).delete(); return; } catch(e){ col = null; } }
  saveLocal();
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function popHeart(media){
  if (reduce) return;
  const h = document.createElement("div"); h.className = "pop"; h.innerHTML = HEART_ON.replace('class="on"', "");
  media.appendChild(h);
  h.animate([{transform:"scale(0)",opacity:0},{transform:"scale(1.15)",opacity:1,offset:.25},{transform:"scale(1)",opacity:1,offset:.55},{transform:"scale(.9)",opacity:0}],{duration:800,easing:"ease-out"}).finished.then(() => h.remove());
}
function fly(from){
  if (reduce || !from) return Promise.resolve();
  const a = from.getBoundingClientRect(), t = favBtn.querySelector("svg").getBoundingClientRect();
  const x0 = a.left + a.width/2 - 14, y0 = a.top + a.height/2 - 14, x1 = t.left + t.width/2 - 14, y1 = t.top + t.height/2 - 14;
  const mx = x0 + (x1 - x0) * .35, my = Math.min(y0, y1) - 60;
  const h = document.createElement("div"); h.className = "fly"; h.innerHTML = HEART_ON.replace('class="on"', "");
  document.body.appendChild(h);
  return h.animate([
    {transform:`translate(${x0}px,${y0}px) scale(.8)`},
    {transform:`translate(${x0}px,${y0 - 14}px) scale(1.4)`, offset:.15},
    {transform:`translate(${mx}px,${my}px) scale(1.1)`, offset:.55},
    {transform:`translate(${x1}px,${y1}px) scale(.55)`, opacity:.95, offset:.9},
    {transform:`translate(${x1}px,${y1}px) scale(.2)`, opacity:0}
  ], {duration:760, easing:"cubic-bezier(.45,0,.2,1)"}).finished.then(() => h.remove());
}
function like(font, from){
  const v = { family: font.f, at: Date.now() }; if (me) v.by = me;
  likes.set(font.id, v); write(font.id, v); syncHearts(font.id, true);
  fly(from).then(() => { syncCount(); favBtn.classList.remove("bump"); void favBtn.offsetWidth; favBtn.classList.add("bump"); });
}
let undoT = null, lastRemoved = null;
function unlike(font){
  const v = likes.get(font.id); if (!v) return;
  likes.delete(font.id); write(font.id, null); syncHearts(font.id, false); syncCount();
  if (inFav) feed.querySelector(`.fav[data-id="${font.id}"]`)?.remove(), !likes.size && renderFav();
  lastRemoved = { font, v };
  toast(`Removed ${font.f}`, true);
}
$("undo").addEventListener("click", () => {
  if (!lastRemoved) return;
  const { font, v } = lastRemoved; lastRemoved = null;
  likes.set(font.id, v); write(font.id, v); syncHearts(font.id, true); syncCount();
  $("toast").classList.remove("show"); clearTimeout(undoT);
  if (inFav) renderFav();
});
function toggle(font, btn){
  if (likes.has(font.id)) unlike(font);
  else { btn.classList.remove("pulse"); void btn.offsetWidth; btn.classList.add("pulse"); like(font, btn); }
}
function syncHearts(id, on){ document.querySelectorAll(`.hb[data-id="${id}"]`).forEach(b => b.setAttribute("aria-pressed", on)); }
function syncAllHearts(){ document.querySelectorAll(".hb[data-id]").forEach(b => b.setAttribute("aria-pressed", likes.has(b.dataset.id))); }
function syncCount(){ const n = $("favN"); n.textContent = likes.size; n.hidden = likes.size === 0; }

/* ---------- controls ---------- */
const stories = $("stories");
STORIES.forEach(s => {
  const b = document.createElement("button"); b.className = "story"; b.dataset.id = s.id;
  b.innerHTML = `<div class="ring"><span>Aa</span></div><small>${s.label}</small>`;
  const f = BY_NAME[s.font]; loadFont(f); b.querySelector("span").style.fontFamily = fam(s.font);
  b.addEventListener("click", () => {
    view.q = ""; $("q").value = "";
    view.cat = s.id;
    render(); window.scrollTo({top:0});
  });
  stories.appendChild(b);
});
let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { view.q = e.target.value.trim(); render(); }, 180); });
function setLook(v){
  look = v;
  document.querySelectorAll(".look button").forEach(x => x.setAttribute("aria-checked", x.dataset.v === look));
  document.querySelectorAll(".post .vlog,#viewer .vlog").forEach(el => el.classList.toggle("paper", look === "paper"));
}
document.querySelectorAll(".look").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("button"); if (b && b.dataset.v !== look) setLook(b.dataset.v);
}));

render(); syncCount();

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) return;
    col = db.collection("likes");
    try { me = user ? await user.id() : null; } catch(e){}
    const local = new Map(likes); let first = true;
    col.onSnapshot(snap => {
      likes.clear();
      snap.docs.forEach(d => { const v = d.data(); if (v) likes.set(d.id, v); });
      if (first){ first = false; local.forEach((v,id) => { if (!likes.has(id)){ likes.set(id, v); write(id, v); } }); }
      syncAllHearts(); syncCount(); if (inFav) renderFav();
    }, () => { col = null; });
  } catch(e){}
})();
</script>
</body>
</html>
